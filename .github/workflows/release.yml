name: Release

# Started by hand, on master. Nothing runs on a push. The build has to be on a
# branch rather than a tag for the cache to be worth anything: a tag's run can
# only read the default branch's cache and writes to a scope no later tag can
# reach, so a tag-triggered build is cold every time. gh cuts the tag itself.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 4.4'
        required: true
        type: string
      publish:
        description: 'Create the tag and the release. Off builds only.'
        required: false
        type: boolean
        default: true

# Bump these to move the release toolchain. LLVM_VERSION is the apt.llvm.org
# and chocolatey version; GCC_VERSION is only the libstdc++ clang compiles
# against on Linux. The project is built as C++23, so it has to be a release
# that implements C++23 whole: jammy's own GCC 12 has no <format>, and 13 has
# no std::ranges::to.
env:
  LLVM_VERSION: "22"
  LLVM_WINDOWS_VERSION: "22.1.8"
  GCC_VERSION: "15"
  CMAKE_VERSION: "4.4.3"
  RUST_VERSION: "1.98.0"

jobs:
  linux:
    name: Linux x64
    runs-on: ubuntu-latest

    # A container rather than the runner image: it fixes the glibc the binary
    # needs at 2.35 instead of inheriting whatever Ubuntu the runner is on,
    # and it outlives the runner label being retired.
    container:
      image: ubuntu:22.04

    steps:
      - name: Install the toolchain
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git gnupg lsb-release wget xz-utils zip zstd \
            software-properties-common build-essential ninja-build pkg-config \
            libcurl4-openssl-dev libfontconfig1-dev

          # jammy's newest is GCC 12, which is not a C++23 library.
          add-apt-repository -y ppa:ubuntu-toolchain-r/test
          apt-get install -y --no-install-recommends "g++-${GCC_VERSION}"

          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          ./llvm.sh "${LLVM_VERSION}"

          wget -q "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz"
          tar -xzf "cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz" -C /opt
          echo "/opt/cmake-${CMAKE_VERSION}-linux-x86_64/bin" >> "$GITHUB_PATH"

          curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain "${RUST_VERSION}" --profile minimal
          echo "/root/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v7

      - name: Read the pinned Slint version
        id: vars
        run: echo "slint=$(sed -n 's/^set(QZDL_SLINT_VERSION "\([^"]*\)").*/\1/p' src/gui/CMakeLists.txt)" >> "$GITHUB_OUTPUT"

      # Our own build of Slint, not anyone else's binaries: same container,
      # same clang, restored byte for byte. Slint's generated headers are kept
      # with it, since a cache hit skips the script that writes them. The key
      # is pinned versions only, so it holds until one of them is bumped.
      - name: Cache the Slint build
        uses: actions/cache@v6
        with:
          path: |
            .download-cache
            build/cargo
            build/_deps/slint-build/generated_include
            /root/.cargo/registry
            /root/.cargo/git
          key: linux-slint-${{ steps.vars.outputs.slint }}-rust${{ env.RUST_VERSION }}-llvm${{ env.LLVM_VERSION }}

      - name: Build
        env:
          CC: clang-${{ env.LLVM_VERSION }}
          CXX: clang++-${{ env.LLVM_VERSION }}
          # Which libstdc++ clang reads, rather than whichever it finds newest.
          CXXFLAGS: --gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/${{ env.GCC_VERSION }}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      # No version in the name: the release step puts one there.
      - name: Package
        run: |
          mkdir -p ZDL4-linux-x64
          cp build/bin/ZDL4 README.md CHANGELOG LICENSE ZDL4-linux-x64/
          (cd ZDL4-linux-x64 && zip -r ../ZDL4-linux-x64.zip .)

      - uses: actions/upload-artifact@v7
        with:
          name: linux-x64
          path: ZDL4-linux-x64.zip
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v7

      - name: Install the toolchain
        run: |
          choco install llvm --version=$env:LLVM_WINDOWS_VERSION -y --force --allow-downgrade --no-progress
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          rustup toolchain install "$env:RUST_VERSION-x86_64-pc-windows-msvc"
          rustup default "$env:RUST_VERSION-x86_64-pc-windows-msvc"

      - name: Read the pinned Slint version
        id: vars
        shell: bash
        run: echo "slint=$(sed -n 's/^set(QZDL_SLINT_VERSION "\([^"]*\)").*/\1/p' src/gui/CMakeLists.txt)" >> "$GITHUB_OUTPUT"

      - name: Cache the Slint build
        uses: actions/cache@v6
        with:
          path: |
            .download-cache
            build/cargo
            build/_deps/slint-build/generated_include
            ~/.cargo/registry
            ~/.cargo/git
          key: windows-slint-${{ steps.vars.outputs.slint }}-rust${{ env.RUST_VERSION }}-llvm${{ env.LLVM_WINDOWS_VERSION }}

      # clang-cl reads the MSVC headers and libraries, so the build runs inside
      # the environment vcvars64.bat sets up.
      #
      # qzdl.rc is UTF-16, which rc.exe reads and clang-cl does not. Naming
      # rc.exe puts CMake on its MSVC path, and that wraps the resource
      # compile in cmcldeps, which runs clang-cl over the file first to
      # collect includes. CMCLDEPS_RC=OFF drops the wrapper so rc.exe gets
      # the file itself; nothing tracks the .rc's own includes then, which
      # costs a fresh build tree nothing.
      - name: Build
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1

          rem The SDK's rc.exe by full path.
          set "RCEXE="
          for /f "delims=" %%i in ('where rc.exe 2^>nul') do if not defined RCEXE set "RCEXE=%%i"
          if not defined RCEXE (
            echo ::error::rc.exe not found after vcvars64
            exit /b 1
          )
          set "RCEXE=%RCEXE:\=/%"
          echo Resource compiler: %RCEXE%

          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl "-DCMAKE_RC_COMPILER=%RCEXE%" -DCMAKE_NINJA_CMCLDEPS_RC=OFF || exit /b 1
          cmake --build build || exit /b 1

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ZDL4-win-x64 | Out-Null
          Copy-Item build\bin\ZDL4.exe, README.md, CHANGELOG, LICENSE ZDL4-win-x64
          Compress-Archive -Path "ZDL4-win-x64\*" -DestinationPath "ZDL4-win-x64.zip"

      # Inno Setup ships on the runner image but not always on PATH.
      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue |
                      Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $iscc) { Write-Output "::error::ISCC.exe not found"; exit 1 }
          Write-Output "Inno Setup: $iscc"

          & $iscc "/DAppVersion=${{ inputs.version }}" packaging\qzdl.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Get-Item dist\ZDL4-win-x64-setup.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: ZDL4-win-x64.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64-installer
          path: dist/ZDL4-win-x64-setup.exe
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [linux, windows]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Write the release notes
        env:
          TAG: ${{ inputs.version }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -eu

          case "$TAG" in
            v*) echo "::error::Versions no longer carry a v, got '$TAG'"; exit 1 ;;
            [0-9]*.[0-9]*) ;;
            *) echo "::error::Version should look like 4.4, got '$TAG'"; exit 1 ;;
          esac

          # The tag carries no v, the archives still do.
          mkdir -p dist
          mv artifacts/linux-x64/ZDL4-linux-x64.zip "dist/ZDL4-v$TAG-linux-x64.zip"
          mv artifacts/windows-x64/ZDL4-win-x64.zip "dist/ZDL4-v$TAG-win-x64.zip"
          mv artifacts/windows-x64-installer/ZDL4-win-x64-setup.exe "dist/ZDL4-v$TAG-win-x64-setup.exe"

          slint=$(sed -n 's/^set(QZDL_SLINT_VERSION "v\?\([^"]*\)").*/\1/p' src/gui/CMakeLists.txt)
          test -n "$slint"

          {
            echo "Refer to [CHANGELOG]($REPO_URL/blob/master/CHANGELOG) for changes."
            echo
            echo "| Download | Slint Version |"
            echo "|----------|---------------|"
            echo "| [Windows x64 installer]($REPO_URL/releases/download/$TAG/ZDL4-v$TAG-win-x64-setup.exe) | $slint |"
            echo "| [Windows x64 portable]($REPO_URL/releases/download/$TAG/ZDL4-v$TAG-win-x64.zip) | $slint |"
            echo "| [Linux x64]($REPO_URL/releases/download/$TAG/ZDL4-v$TAG-linux-x64.zip) | $slint |"
          } > notes.md

          cat notes.md

      # No --verify-tag: the tag does not exist yet, gh cuts it at this commit.
      - name: Create the tag and the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.version }}" \
            --target "${{ github.sha }}" \
            --title "${{ inputs.version }}" \
            --notes-file notes.md \
            dist/*.zip
