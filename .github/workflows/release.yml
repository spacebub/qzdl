name: Release

on:
  workflow_dispatch:

env:
  LLVM_VERSION: "22"
  GCC_VERSION: "15"
  CMAKE_VERSION: "4.4.3"

jobs:
  check:
    name: Check the version
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.v.outputs.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: v
        run: |
          set -eu

          version=$(sed -n 's/^[[:space:]]*VERSION[[:space:]]\{1,\}\([0-9.]\{1,\}\).*/\1/p' CMakeLists.txt | head -1)

          if [ -z "$version" ]; then
            echo "::error::No VERSION found in CMakeLists.txt"
            exit 1
          fi

          for existing in "$version" "v$version"; do
            if git rev-parse -q --verify "refs/tags/$existing" >/dev/null; then
              echo "::error::$existing is already released. Bump the version in CMakeLists.txt first."
              exit 1
            fi
          done

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

  linux:
    name: Linux x64
    needs: check
    runs-on: ubuntu-latest

    container:
      image: ubuntu:22.04

    steps:
      - name: Install the toolchain
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git gnupg lsb-release wget xz-utils zip zstd \
            software-properties-common build-essential ninja-build pkg-config \
            libcurl4-openssl-dev \
            libx11-dev libxext-dev libxcursor-dev libxi-dev libxfixes-dev \
            libxrandr-dev libxrender-dev libxss-dev libxkbcommon-dev \
            libwayland-dev libwayland-bin libegl1-mesa-dev

          add-apt-repository -y ppa:ubuntu-toolchain-r/test
          apt-get install -y --no-install-recommends "g++-${GCC_VERSION}"

          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          ./llvm.sh "${LLVM_VERSION}"

          wget -q "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz"
          tar -xzf "cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz" -C /opt
          echo "/opt/cmake-${CMAKE_VERSION}-linux-x86_64/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v7

      - name: Read the pinned dependency versions
        id: deps
        shell: bash
        run: |
          key=$(sed -n 's/^set(QZDL_[A-Z0-9]*_VERSION \([^)]*\)).*/\1/p' \
                  src/gui/CMakeLists.txt src/core/CMakeLists.txt | tr '\n' '-')
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Cache the fetched sources
        uses: actions/cache@v6
        with:
          path: .download-cache
          key: linux-deps-${{ steps.deps.outputs.key }}

      - name: Build
        env:
          CC: clang-${{ env.LLVM_VERSION }}
          CXX: clang++-${{ env.LLVM_VERSION }}
          CXXFLAGS: --gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/${{ env.GCC_VERSION }}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DQZDL_RELEASE=ON
          cmake --build build

      - name: Package
        run: |
          mkdir -p ZDL4-linux-x64
          cp build/bin/ZDL4 README.md CHANGELOG LICENSE AUTHORS ZDL4-linux-x64/
          (cd ZDL4-linux-x64 && zip -r ../ZDL4-linux-x64.zip .)

      - uses: actions/upload-artifact@v7
        with:
          name: linux-x64
          path: ZDL4-linux-x64.zip
          if-no-files-found: error

  windows:
    name: Windows x64
    needs: check
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v7

      - name: Read the pinned dependency versions
        id: deps
        shell: bash
        run: |
          key=$(sed -n 's/^set(QZDL_[A-Z0-9]*_VERSION \([^)]*\)).*/\1/p' \
                  src/gui/CMakeLists.txt src/core/CMakeLists.txt | tr '\n' '-')
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Cache the fetched sources
        uses: actions/cache@v6
        with:
          path: .download-cache
          key: windows-deps-${{ steps.deps.outputs.key }}

      - name: Build
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1

          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DQZDL_RELEASE=ON || exit /b 1
          cmake --build build || exit /b 1

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ZDL4-win-x64 | Out-Null
          Copy-Item build\bin\ZDL4.exe, README.md, CHANGELOG, LICENSE, AUTHORS ZDL4-win-x64
          Compress-Archive -Path "ZDL4-win-x64\*" -DestinationPath "ZDL4-win-x64.zip"

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue |
                      Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $iscc) { Write-Output "::error::ISCC.exe not found"; exit 1 }
          Write-Output "Inno Setup: $iscc"

          & $iscc "/DAppVersion=${{ needs.check.outputs.version }}" packaging\qzdl.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Get-Item dist\ZDL4-win-x64-setup.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: ZDL4-win-x64.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64-installer
          path: dist/ZDL4-win-x64-setup.exe
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [check, linux, windows]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Write the release notes
        env:
          VERSION: ${{ needs.check.outputs.version }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -eu

          mkdir -p dist
          mv artifacts/linux-x64/ZDL4-linux-x64.zip "dist/ZDL4-v$VERSION-linux-x64.zip"
          mv artifacts/windows-x64/ZDL4-win-x64.zip "dist/ZDL4-v$VERSION-win-x64.zip"
          mv artifacts/windows-x64-installer/ZDL4-win-x64-setup.exe "dist/ZDL4-v$VERSION-win-x64-setup.exe"

          {
            echo "Refer to [CHANGELOG]($REPO_URL/blob/master/CHANGELOG) for changes."
            echo
            echo "| Download |"
            echo "|----------|"
            echo "| [Windows x64 installer]($REPO_URL/releases/download/$VERSION/ZDL4-v$VERSION-win-x64-setup.exe) |"
            echo "| [Windows x64 portable]($REPO_URL/releases/download/$VERSION/ZDL4-v$VERSION-win-x64.zip) |"
            echo "| [Linux x64]($REPO_URL/releases/download/$VERSION/ZDL4-v$VERSION-linux-x64.zip) |"
          } > notes.md

          cat notes.md

      - name: Create the tag and the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.check.outputs.version }}" \
            --target "${{ github.sha }}" \
            --title "${{ needs.check.outputs.version }}" \
            --notes-file notes.md \
            dist/*

  winget:
    name: Submit to winget
    needs: [check, release]
    runs-on: windows-latest
    # Off until the first manual submission is merged into microsoft/winget-pkgs:
    # wingetcreate update looks the package up there and fails while it is absent.
    # Turn this back on by deleting the `if`, not by editing it.
    if: false
    continue-on-error: true

    env:
      WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}

    steps:
      - run: |
          $version = "${{ needs.check.outputs.version }}"
          $url = "${{ github.server_url }}/${{ github.repository }}/releases/download/$version/ZDL4-v$version-win-x64-setup.exe"

          curl.exe -fL -o wingetcreate.exe https://aka.ms/wingetcreate/latest
          .\wingetcreate.exe update spacebub.qzdl --submit --version $version --urls $url
