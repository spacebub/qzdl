name: Release

on:
  workflow_dispatch:
    inputs:
      winget:
        description: "Submit to winget"
        type: boolean
        default: false

env:
  LLVM_VERSION: "22"
  GCC_VERSION: "15"
  CMAKE_VERSION: "4.4.3"
  LINUXDEPLOY_VERSION: "1-alpha-20251107-1"
  LINUXDEPLOY_SHA256: "c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d"
  APPIMAGETOOL_VERSION: "1.9.1"
  APPIMAGETOOL_SHA256: "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
  APPIMAGE_RUNTIME_VERSION: "20251108"
  APPIMAGE_RUNTIME_SHA256: "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d"

jobs:
  check:
    name: Check the version
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.v.outputs.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: v
        run: |
          set -eu

          version=$(sed -n 's/^[[:space:]]*VERSION[[:space:]]\{1,\}\([0-9.]\{1,\}\).*/\1/p' CMakeLists.txt | head -1)

          if [ -z "$version" ]; then
            echo "::error::No VERSION found in CMakeLists.txt"
            exit 1
          fi

          for existing in "$version" "v$version"; do
            if git rev-parse -q --verify "refs/tags/$existing" >/dev/null; then
              echo "::error::$existing is already released. Bump the version in CMakeLists.txt first."
              exit 1
            fi
          done

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

  tests:
    uses: ./.github/workflows/ci.yml

  linux:
    name: Linux x64
    needs: check
    runs-on: ubuntu-latest

    container:
      image: ubuntu:22.04

    steps:
      - name: Install the toolchain
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl file git gnupg lsb-release wget xz-utils zip zstd \
            software-properties-common build-essential ninja-build pkg-config \
            libcurl4-openssl-dev \
            libx11-dev libxext-dev libxcursor-dev libxi-dev libxfixes-dev \
            libxrandr-dev libxrender-dev libxss-dev libxkbcommon-dev \
            libwayland-dev libwayland-bin libegl1-mesa-dev

          add-apt-repository -y ppa:ubuntu-toolchain-r/test
          apt-get install -y --no-install-recommends "g++-${GCC_VERSION}"

          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          ./llvm.sh "${LLVM_VERSION}"

          wget -q "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz"
          tar -xzf "cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz" -C /opt
          echo "/opt/cmake-${CMAKE_VERSION}-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Install the AppImage tools
        run: |
          set -eux

          fetch() {
            curl -fsSL -o "$3" "$1"
            echo "$2  $3" | sha256sum -c -
          }

          # The container has no FUSE, so each AppImage is unpacked and run from its AppRun.
          unpack() {
            fetch "$1" "$2" tool.AppImage
            chmod +x tool.AppImage
            ./tool.AppImage --appimage-extract > /dev/null
            mv squashfs-root "$3"
            rm tool.AppImage
          }

          unpack "https://github.com/linuxdeploy/linuxdeploy/releases/download/${LINUXDEPLOY_VERSION}/linuxdeploy-x86_64.AppImage" \
                 "${LINUXDEPLOY_SHA256}" /opt/linuxdeploy
          unpack "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage" \
                 "${APPIMAGETOOL_SHA256}" /opt/appimagetool
          fetch "https://github.com/AppImage/type2-runtime/releases/download/${APPIMAGE_RUNTIME_VERSION}/runtime-x86_64" \
                "${APPIMAGE_RUNTIME_SHA256}" /opt/appimage-runtime

          ln -s /opt/linuxdeploy/AppRun /usr/local/bin/linuxdeploy
          ln -s /opt/appimagetool/AppRun /usr/local/bin/appimagetool

      - uses: actions/checkout@v7

      - name: Read the pinned dependency versions
        id: deps
        shell: bash
        run: |
          key=$(sed -n 's/^set(QZDL_[A-Z0-9]*_VERSION \([^)]*\)).*/\1/p' \
                  CMakeLists.txt | tr '\n' '-')
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Cache the fetched sources
        uses: actions/cache@v6
        with:
          path: .download-cache
          key: linux-deps-${{ steps.deps.outputs.key }}

      - name: Build
        env:
          CC: clang-${{ env.LLVM_VERSION }}
          CXX: clang++-${{ env.LLVM_VERSION }}
          CXXFLAGS: --gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/${{ env.GCC_VERSION }}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DQZDL_RELEASE=ON
          cmake --build build

      - name: Package
        run: |
          set -eux

          mkdir -p ZDL4-linux-x64
          cp build/bin/ZDL4 README.md CHANGELOG.md LICENSE AUTHORS.md ZDL4-linux-x64/
          (cd ZDL4-linux-x64 && zip -r ../ZDL4-linux-x64.zip .)

          mkdir -p AppDir/usr/bin AppDir/usr/share/doc/qzdl
          cp build/bin/ZDL4 AppDir/usr/bin/
          cp README.md CHANGELOG.md LICENSE AUTHORS.md AppDir/usr/share/doc/qzdl/

          # Nothing is bundled. libcurl from this image has the Debian CA path built in,
          # which RHEL and openSUSE lack, so HTTPS goes through the libcurl of the host.
          linuxdeploy --appdir AppDir --executable AppDir/usr/bin/ZDL4 --exclude-library '*' \
            --desktop-file assets/qzdl.desktop --icon-file assets/qzdl-256.png \
            --icon-filename qzdl

          # Without a runtime file appimagetool downloads the newest runtime build unchecked.
          ARCH=x86_64 appimagetool --runtime-file /opt/appimage-runtime AppDir ZDL4-x86_64.AppImage

      - uses: actions/upload-artifact@v7
        with:
          name: linux-x64
          path: ZDL4-linux-x64.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: linux-x64-appimage
          path: ZDL4-x86_64.AppImage
          if-no-files-found: error

  windows:
    name: Windows x64
    needs: check
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v7

      - name: Read the pinned dependency versions
        id: deps
        shell: bash
        run: |
          key=$(sed -n 's/^set(QZDL_[A-Z0-9]*_VERSION \([^)]*\)).*/\1/p' \
                  CMakeLists.txt | tr '\n' '-')
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Cache the fetched sources
        uses: actions/cache@v6
        with:
          path: .download-cache
          key: windows-deps-${{ steps.deps.outputs.key }}

      - name: Build
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1

          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DQZDL_RELEASE=ON || exit /b 1
          cmake --build build || exit /b 1

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ZDL4-win-x64 | Out-Null
          Copy-Item build\bin\ZDL4.exe, README.md, CHANGELOG.md, LICENSE, AUTHORS.md ZDL4-win-x64
          Compress-Archive -Path "ZDL4-win-x64\*" -DestinationPath "ZDL4-win-x64.zip"

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue |
                      Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $iscc) { Write-Output "::error::ISCC.exe not found"; exit 1 }
          Write-Output "Inno Setup: $iscc"

          & $iscc "/DAppVersion=${{ needs.check.outputs.version }}" packaging\qzdl.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Get-Item dist\ZDL4-win-x64-setup.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: ZDL4-win-x64.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64-installer
          path: dist/ZDL4-win-x64-setup.exe
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [check, tests, linux, windows]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Write the release notes
        env:
          VERSION: ${{ needs.check.outputs.version }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -eu

          mkdir -p dist
          mv artifacts/linux-x64/ZDL4-linux-x64.zip "dist/ZDL4-v$VERSION-linux-x64.zip"
          mv artifacts/linux-x64-appimage/ZDL4-x86_64.AppImage "dist/ZDL4-v$VERSION-linux-x64.AppImage"
          mv artifacts/windows-x64/ZDL4-win-x64.zip "dist/ZDL4-v$VERSION-win-x64.zip"
          mv artifacts/windows-x64-installer/ZDL4-win-x64-setup.exe "dist/ZDL4-v$VERSION-win-x64-setup.exe"

          # Best effort: without a section for this version the notes are just the link.
          : > section.md
          if [ -f CHANGELOG.md ]; then
            awk -v v="$VERSION" '
              !found { if ($1 == "##" && $2 == v) found = 1; next }
              $1 == "##" { exit }
              NF == 0 { blanks++; next }
              { while (blanks && printed) { print ""; blanks-- }
                blanks = 0; printed = 1; print }
            ' CHANGELOG.md > section.md || : > section.md
          fi

          {
            if [ -s section.md ]; then
              cat section.md
              echo
            fi

            echo "Refer to [CHANGELOG]($REPO_URL/blob/master/CHANGELOG.md) for the full history."
            echo
            echo "| Download |"
            echo "|----------|"
            echo "| [Windows x64 installer]($REPO_URL/releases/download/$VERSION/ZDL4-v$VERSION-win-x64-setup.exe) |"
            echo "| [Windows x64 portable]($REPO_URL/releases/download/$VERSION/ZDL4-v$VERSION-win-x64.zip) |"
            echo "| [Linux x64 AppImage]($REPO_URL/releases/download/$VERSION/ZDL4-v$VERSION-linux-x64.AppImage) |"
            echo "| [Linux x64 portable]($REPO_URL/releases/download/$VERSION/ZDL4-v$VERSION-linux-x64.zip) |"
          } > notes.md

          cat notes.md

      - name: Create the tag and the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.check.outputs.version }}" \
            --target "${{ github.sha }}" \
            --title "${{ needs.check.outputs.version }}" \
            --notes-file notes.md \
            dist/*

  winget:
    needs: [check, release]
    if: inputs.winget
    uses: ./.github/workflows/winget.yml
    with:
      version: ${{ needs.check.outputs.version }}
    secrets: inherit
